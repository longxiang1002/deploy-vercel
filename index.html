<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎光临</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, 'Noto Sans CJK SC', sans-serif;
            background: #0f0c20;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景流光渐变与粒子动画 */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(125deg, #0f0c20, #15102a, #06172e, #0b0214);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            z-index: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 欢迎卡片主体 */
        .welcome-card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 3rem 4rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            animation: cardAppear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 头像/图标发光动效 */
        .avatar-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .avatar-box svg {
            width: 45px;
            height: 45px;
            fill: #fff;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(79, 172, 254, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(0, 242, 254, 0.8); }
        }

        /* 主标题：逐字淡入及霓虹效果 */
        .title {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            white-space: nowrap;
            overflow: hidden;
            animation: textFocus 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s both;
        }

        @keyframes textFocus {
            0% { filter: blur(12px); opacity: 0; }
            100% { filter: blur(0); opacity: 1; }
        }

        /* 副标题 */
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 互动按钮样式与悬停特效 */
        .enter-btn {
            position: relative;
            display: inline-block;
            padding: 14px 42px;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            border-radius: 50px;
            background: linear-gradient(90deg, #ff007f, #7f00ff);
            background-size: 200% auto;
            border: none;
            cursor: pointer;
            outline: none;
            box-shadow: 0 10px 20px rgba(127, 0, 255, 0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            animation: fadeIn 1s ease 1.6s forwards;
        }

        .enter-btn:hover {
            background-position: right center;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 0, 127, 0.5);
        }

        .enter-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 15px rgba(255, 0, 127, 0.4);
        }

        /* 屏幕自适应 */
        @media (max-width: 480px) {
            .welcome-card {
                padding: 2.5rem 2rem;
                width: 90%;
            }
            .title { font-size: 2rem; }
            .subtitle { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- 动态渐变背景 -->
    <div class="background-container"></div>

    <!-- 欢迎卡片主体 -->
    <div class="welcome-card">
        <!-- 中央图标 -->
        <div class="avatar-box">
            <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- 欢迎文字 -->
        <h1 class="title">遇见你，真好</h1>
        <p class="subtitle">欢迎来到我的全新创意空间</p>

        <!-- 互动进入按钮 -->
        <button class="enter-btn" onclick="alert('欢迎进入新世界！')">点击开启</button>
    </div>

</body>
</html>
